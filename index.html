<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Compression App Design</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    img {
      width: 100%;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h1>Image Compression App Design</h1>
  <p>
    This app will let users upload an image and select a compression rank
    with a slider. It will display the original and compressed images side
    by side so users can compare them. It will also show the reconstruction
    error for the selected rank.
  </p>
  <img src="app-mockup.png" alt="Mockup of the image compression app">
</body>
</html>
